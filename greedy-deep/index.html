<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Greedy Deep — Click it! Studios</title>
<meta name="description" content="Dwarves dig down. You tap the vein. Gold buys picks, crew, and deeper reach. A free browser idle game from Click it! Studios.">
<link rel="stylesheet" href="style.css?v=3">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23241f2b'/><text x='50' y='70' font-size='56' text-anchor='middle'>⛏️</text></svg>">
</head>
<body class="booting">

<div id="col">

  <div id="topbar">
    <div class="stat">
      <span class="label">GOLD</span>
      <span class="value" id="stat-gold">0</span>
    </div>
    <div class="stat rate">
      <span class="label">INCOME</span>
      <span class="value" id="stat-rate">+0/s</span>
    </div>
    <div class="stat right">
      <span class="label">DEPTH</span>
      <span class="value" id="stat-depth">0.0 m</span>
    </div>
  </div>

  <div id="shaftwrap">
    <canvas id="shaft"></canvas>
    <div id="hint">tap the vein &#9656;</div>
    <pre id="dbg" class="hidden"></pre>
  </div>

  <div id="panel">
    <div id="panel-head">THE COMPANY STORE</div>
    <div id="shop"></div>
  </div>

  <div id="foot">Greedy Deep — M1 core loop. Placeholder art; the mine gets its face in M3.</div>
</div>

<script src="src/engine.js?v=2"></script>
<script src="src/save.js?v=2"></script>
<script src="src/gd.js?v=2"></script>
<script src="src/render.js?v=2"></script>
<script src="src/ui.js?v=3"></script>
</body>
</html>
