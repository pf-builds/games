<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d1a24">
<title>Sapper's Path</title>
<meta name="description" content="Goblins stole the crown and walled themselves in. Each crew breaks one material. Break in from the outside and reach the keep.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%239a9ca6'/><rect x='30' y='38' width='40' height='52' fill='%235b5460'/><rect x='30' y='26' width='9' height='14' fill='%235b5460'/><rect x='45' y='26' width='10' height='14' fill='%235b5460'/><rect x='61' y='26' width='9' height='14' fill='%235b5460'/><path d='M42 90V70a8 8 0 0 1 16 0v20z' fill='%23f2c230'/></svg>">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div id="app">
  <header id="top">
    <button id="btn-menu" class="round" aria-label="Levels"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" fill="currentColor"/></svg></button>
    <div id="lvl"><span id="lvl-num"></span><span id="lvl-name"></span></div>
    <div id="hud" aria-live="polite"><span id="hud-used">0</span><span class="of">/</span><span id="hud-par">0</span><span class="star" aria-hidden="true">&#9733;</span></div>
  </header>
  <div id="teach" hidden></div>
  <main id="play">
    <div id="stage"><canvas id="board" aria-label="The castle"></canvas></div>
    <div id="rail">
      <div id="cards">
        <button class="crew" data-m="0" aria-label="Masons"><canvas class="ico" width="64" height="64"></canvas><b class="n">0</b><span class="lab">Masons</span></button>
        <button class="crew" data-m="1" aria-label="Axemen"><canvas class="ico" width="64" height="64"></canvas><b class="n">0</b><span class="lab">Axemen</span></button>
        <button class="crew" data-m="2" aria-label="Goats"><canvas class="ico" width="64" height="64"></canvas><b class="n">0</b><span class="lab">Goats</span></button>
        <button class="crew" data-m="3" aria-label="Torches"><canvas class="ico" width="64" height="64"></canvas><b class="n">0</b><span class="lab">Torches</span></button>
      </div>
      <div id="tools"><button id="btn-undo">Undo</button><button id="btn-restart">Restart</button></div>
    </div>
  </main>
  <div id="panel" class="sheet" hidden>
    <div class="card">
      <div id="p-stars" class="stars"></div>
      <div id="p-title" class="p-title"></div>
      <div id="p-line" class="p-line"></div>
      <div class="row"><button id="p-primary" class="primary"></button><button id="p-secondary"></button><button id="p-third"></button></div>
    </div>
  </div>
  <section id="title" class="screen">
    <div class="title-card">
      <h1>Sapper's Path</h1>
      <p>Goblins stole the crown and walled themselves in. Each crew breaks one material. Break in from the outside and reach the keep.</p>
      <button id="btn-play" class="primary big">Play</button>
      <button id="btn-levels" class="big">Levels</button>
      <p id="load-msg" class="small"></p>
    </div>
  </section>
  <section id="select" class="screen" hidden>
    <div class="select-top"><h2>Levels</h2><button id="btn-back" hidden>Back</button></div>
    <div id="worlds"></div>
  </section>
</div>
<script src="src/engine.js?v=2"></script>
<script src="src/solver.js?v=2"></script>
<script src="src/save.js?v=2"></script>
<script src="src/game.js?v=2"></script>
<script src="src/render.js?v=2"></script>
<script src="src/main.js?v=2"></script>
</body>
</html>
