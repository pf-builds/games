<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sapper's Path feel check</title>
<style>
  :root { --bg: #1d1a17; --panel: #2a2622; --ink: #f3ead8; --dim: #a79c88; --line: #4a4239; --warn: #ff6b57; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 8px 16px 24px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  h1 { font-size: 15px; margin: 0; }
  .meta { color: var(--dim); font-size: 12px; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  nav a { color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; text-decoration: none; font-size: 12px; }
  nav a[aria-current="page"] { background: #5a4a2c; border-color: #c9a45a; }
  #wrap { display: flex; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; border-radius: 4px; }
  #status { min-height: 20px; margin: 6px 0 4px; font-size: 13px; }
  #status.fail { color: var(--warn); font-weight: 600; }
  #status.win { color: #9ee52a; font-weight: 600; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  #line { margin: 4px 0 8px; }
  .slot { height: 30px; border: 1px dashed var(--line); border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 4px; font-weight: 700; font-size: 15px; }
  .slot.full { border-style: solid; border-color: #6a5f52; background: var(--panel); }
  .slot.extra { visibility: hidden; }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.5); flex: none; }
  .col { display: flex; flex-direction: column; gap: 3px; }
  button.card { appearance: none; border: 2px solid #6a5f52; background: var(--panel); color: var(--ink); border-radius: 8px; height: 58px; padding: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; font: inherit; }
  button.card:disabled { opacity: .35; cursor: default; }
  button.card .n { font-size: 22px; font-weight: 800; line-height: 1; }
  button.card .crew { font-size: 10px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  button.card .sw { width: 100%; height: 8px; border-radius: 3px; }
  .next { height: 18px; border-radius: 5px; background: var(--panel); display: flex; align-items: center; gap: 4px; padding: 0 5px; font-size: 12px; font-weight: 700; }
  .next.d1 { opacity: .7; } .next.d2 { opacity: .5; } .next.d3 { opacity: .32; }
  .next.empty { visibility: hidden; }
  .bar { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 10px; }
  .bar button { appearance: none; font: inherit; font-weight: 700; color: var(--ink); background: #5a4a2c; border: 1px solid #c9a45a; border-radius: 8px; padding: 8px 18px; cursor: pointer; }
  .legend { color: var(--dim); font-size: 11px; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <header><h1 id="title">Feel check</h1><span class="meta" id="meta"></span></header>
  <nav id="nav" aria-label="Levels"></nav>
  <div id="wrap"><canvas id="board" aria-label="Fort board"></canvas></div>
  <div id="status" role="status"></div>
  <div class="row" id="line" aria-label="Holding line"></div>
  <div class="row" id="tray" aria-label="Tray"></div>
  <div class="bar"><span class="meta" id="left"></span><button type="button" id="retry">Retry</button></div>
  <p class="legend">Debug board for M0 (placeholder art, instant resolution). Red rings are archer range; black pixels are locked gates; amber is a key. <span id="band"></span></p>
</main>
<script>
(() => {
  "use strict";
  const V = "m0-1", q = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  // One level per band by default (early, mid, late); ?level=N plays any level, ?diff=easy|normal|hard.
  const PICKS = [8, 29, 64];
  const load = (src) => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("load " + src)); document.head.append(s); });
  const getJSON = (u) => fetch(u, { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(u + " " + r.status); return r.json(); });
  Promise.all([load("../src/engine.js?v=" + V), getJSON("../config.json?v=" + V), getJSON("../levels/levels.json?v=" + V)]).then(([, cfg, lv]) => start(cfg.v3, lv.levels)).catch((e) => { $("status").textContent = "Load failed: " + e.message; $("status").className = "fail"; });

  function start(C, LEVELS) {
    const E = window.SappersPath.engine, MATS = C.mats, F = C.feel;
    const n = +q.get("level") || PICKS[0], diff = C.rules[q.get("diff")] ? q.get("diff") : "normal";
    const L = LEVELS.find((l) => l.n === n) || LEVELS[0];
    const B = E.compile(L), S = E.sim(B, C.rules[diff]);
    $("nav").innerHTML = PICKS.map((k) => { const l = LEVELS.find((x) => x.n === k); return `<a href="?level=${k}&diff=${diff}"${k === L.n ? ' aria-current="page"' : ""}>L${k} · ${l ? l.band : ""}</a>`; }).join("");
    $("title").textContent = "Level " + L.n + " · Era " + L.era;
    $("meta").textContent = diff + " · " + L.w + "×" + L.h + " · " + B.ncards + " cards";
    const g = L.grade && L.grade[diff];
    $("band").textContent = "Band " + L.band + " (Normal random-tap " + (L.grade ? (100 * L.grade.normal.rate).toFixed(1) + "%" : "?") + (g && diff !== "normal" ? ", " + diff + " " + (100 * g.rate).toFixed(1) + "%" : "") + ").";

    // Board canvas at cellPx CSS pixels per cell (the phone target), crisp on high-DPI screens.
    const cv = $("board"), ctx = cv.getContext("2d"), k = Math.min(3, window.devicePixelRatio || 1), s = F.cellPx * k;
    cv.width = B.w * s; cv.height = B.h * s; cv.style.width = B.w * F.cellPx + "px"; cv.style.height = B.h * F.cellPx + "px";
    const mix = (hex, f) => { const v = parseInt(hex.slice(1), 16), t = f < 0 ? 0 : 255, p = Math.abs(f), ch = (sh) => Math.round(((v >> sh) & 255) + (t - ((v >> sh) & 255)) * p); return `rgb(${ch(16)},${ch(8)},${ch(0)})`; };
    const PAL = MATS.map((m) => m && { base: m.c, hi: mix(m.c, 0.3), lo: mix(m.c, -0.32), grout: mix(m.c, -0.6) });
    const GROUND = { [E.GRASS]: C.ground.grass, [E.DIRT]: C.ground.dirt, [E.CAMP]: C.ground.camp, [E.WATER]: C.ground.water };
    let flash = [];
    function draw() {
      const a = S.a, w = B.w;
      for (let i = 0; i < a.length; i++) {
        const x = (i % w) * s, y = ((i / w) | 0) * s, v = a[i];
        if (v > 0) {
          const p = PAL[v], gi = Math.max(1, Math.round(s * 0.08)), b = Math.max(1, Math.round(s * 0.16));
          ctx.fillStyle = p.grout; ctx.fillRect(x, y, s, s);
          ctx.fillStyle = p.base; ctx.fillRect(x + gi, y + gi, s - 2 * gi, s - 2 * gi);
          ctx.fillStyle = p.hi; ctx.fillRect(x + gi, y + gi, s - 2 * gi, b); ctx.fillRect(x + gi, y + gi, b, s - 2 * gi);
          ctx.fillStyle = p.lo; ctx.fillRect(x + gi, y + s - gi - b, s - 2 * gi, b); ctx.fillRect(x + s - gi - b, y + gi, b, s - 2 * gi);
        } else { ctx.fillStyle = GROUND[v]; ctx.fillRect(x, y, s, s); }
      }
      ctx.fillStyle = "rgba(255,248,225,.55)";
      for (const c of flash) ctx.fillRect((c % w) * s, ((c / w) | 0) * s, s, s);
      // Archer ranges while their tower stands.
      ctx.save(); ctx.lineWidth = Math.max(1, s * 0.18); ctx.setLineDash([s * 0.7, s * 0.5]);
      B.towers.forEach((t, i) => { if (!(S.standing & (1 << i))) return;
        ctx.beginPath(); ctx.arc((t.cx + 0.5) * s, (t.cy + 0.5) * s, t.r * s, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(226,70,55,${F.rangeAlpha})`; ctx.fill(); ctx.strokeStyle = "rgba(226,70,55,.9)"; ctx.stroke(); });
      ctx.restore();
    }
    const sw = (m) => `<span class="sw" style="background:${MATS[m].c}"></span>`;
    function ui() {
      const done = S.status !== E.PLAYING;
      $("line").replaceChildren(...Array.from({ length: 5 }, (_, i) => {
        const d = document.createElement("div"), full = i < S.lineLen;
        d.className = "slot" + (full ? " full" : "") + (i >= S.cap ? " extra" : "");
        if (full) d.innerHTML = sw(S.lineM[i]) + S.lineN[i];
        return d;
      }));
      if (S.cap > 5) $("line").style.gridTemplateColumns = `repeat(${S.cap}, 1fr)`;
      $("tray").replaceChildren(...Array.from({ length: 5 }, (_, j) => {
        const col = document.createElement("div"); col.className = "col";
        const b = document.createElement("button"); b.type = "button"; b.className = "card"; b.dataset.col = j;
        const f = S.front(j);
        if (f >= 0) { const m = B.cardM[f]; b.innerHTML = `<span class="sw" style="background:${MATS[m].c}"></span><span class="n">${B.cardN[f]}</span><span class="crew">${MATS[m].crew}</span>`; b.setAttribute("aria-label", MATS[m].crew + ", " + B.cardN[f] + " sappers"); }
        else b.innerHTML = '<span class="crew">empty</span>';
        b.disabled = done || f < 0;
        b.addEventListener("click", () => tap(j));
        col.append(b);
        for (let d = 1; d <= F.behind; d++) {
          const nx = document.createElement("div"), h = S.heads[j] + d, has = h < B.colLen[j];
          nx.className = "next d" + d + (has ? "" : " empty");
          if (has) { const ci = B.colStart[j] + h; nx.innerHTML = sw(B.cardM[ci]) + B.cardN[ci]; }
          col.append(nx);
        }
        return col;
      }));
      $("left").textContent = S.pixLeft + " px left · line " + S.lineLen + "/" + S.cap;
      const st = $("status");
      if (S.status === E.WON) { st.textContent = "Fort razed. The goblins run for it."; st.className = "win"; }
      else if (S.status === E.FAILED) {
        const m = S.failMat, who = m ? MATS[m].crew : "";
        st.textContent = { overflow: "The holding line overflowed" + (who ? " (" + who + ")" : "") + ".", short: "Archers cut down the " + who + ": not enough left.", stuck: "No squads left, and the holding line can't reach anything.", nomove: "No safe move: every front squad would overflow the line." }[S.reason] || "Assault failed.";
        st.className = "fail";
      } else { st.textContent = S.hits ? "Archer hits so far: " + S.hits + (S.kills ? " (killed " + S.kills + ")" : "") : "Tap a front card."; st.className = ""; }
      draw();
    }
    function tap(j) {
      if (S.status !== E.PLAYING) return;
      S.logOn = true; S.clearLog();
      if (S.play(j) === -2) return;
      flash = []; for (let i = 0; i < S.evLen; i += 3) if (S.ev[i] === E.EV.EAT) flash.push(S.ev[i + 1]);
      ui();
    }
    $("retry").addEventListener("click", () => { S.reset(); flash = []; ui(); });
    // Debug handle for the headless check.
    window.FEEL = { level: L, diff, play: tap, state: () => ({ status: S.status, reason: S.reason, pixLeft: S.pixLeft, lineLen: S.lineLen, heads: Array.from(S.heads) }) };
    ui();
  }
})();
</script>
</body>
</html>
